<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>Remoza-docházka</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Docházka">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root {
  --navy: #14213D; --orange: #FF6B35;
  --bg: #f4f5f8; --surface: #ffffff; --surface-2: #f7f8fb; --border: #e1e5ee;
  --text: #14213D; --muted: #5d6882; --primary: #FF6B35; --primary-ink: #14213D;
  --link: #14213D; --accent-ink: #b8441a;
  --side: #14213D; --side-ink: #c3cbdc; --side-active: #22345c;
  --btn-out: #14213D; --btn-out-ink: #ffffff; --btn-brk: #ffe3d8; --btn-brk-ink: #14213D;
  --ok: #1a9e5c; --ok-bg: #e5f6ed; --warn: #b8670b; --warn-bg: #fdf1e1;
  --bad: #d23b3b; --bad-bg: #fde8e8; --info-bg: #fff0e9;
  --ring-track: #e7eaf1; --shadow: 0 1px 3px rgba(20,33,61,.07), 0 1px 2px rgba(20,33,61,.04);
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b1324; --surface: #14213D; --surface-2: #1a2a4c; --border: #27385f;
    --text: #e9edf5; --muted: #9aa6bf; --primary: #FF6B35; --primary-ink: #14213D;
    --link: #ff9a73; --accent-ink: #ff9a73;
    --side: #0a1120; --side-ink: #aeb8cd; --side-active: #1c2b4d;
    --btn-out: #2a3d68; --btn-out-ink: #ffffff; --btn-brk: #43291f; --btn-brk-ink: #ffc2aa;
    --ok: #3ccf87; --ok-bg: #12321f; --warn: #f0b14a; --warn-bg: #3a2b10;
    --bad: #ff6b6b; --bad-bg: #3a1717; --info-bg: #3a2418; --ring-track: #27385f;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
h1 { font-size: 22px; margin: 0 0 16px; font-weight: 650; }
h2 { font-size: 17px; margin: 0 0 12px; font-weight: 600; }
a { color: var(--link); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }

/* layout */
.shell { display: flex; min-height: 100vh; }
.side { width: 232px; background: var(--side); color: var(--side-ink); flex-shrink: 0;
  display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 16px; color: #fff; font-weight: 650; border-bottom: 1px solid rgba(255,255,255,.07); }
.brand small { display: block; font-weight: 400; color: var(--side-ink); font-size: 12px; }
.logo { width: 34px; height: 34px; border-radius: 9px; background: var(--primary); color: var(--primary-ink);
  display: grid; place-items: center; font-weight: 700; overflow: hidden; flex-shrink: 0; }
.logo img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
.logo.ic { background: none; overflow: hidden; }
.logo.ic img { background: none; object-fit: cover; }
.brand .logo.ic { width: 46px; height: 46px; border-radius: 11px; }
.nav { padding: 6px 8px; flex: 1; overflow-y: auto; }
.nav-sec { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 14px 10px 6px; opacity: .6; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px;
  color: var(--side-ink); text-decoration: none; cursor: pointer; }
.nav a:hover { background: var(--side-active); color: #fff; }
.nav a.active { background: var(--side-active); color: #fff; box-shadow: inset 3px 0 0 var(--orange); }
.nav a.active svg { color: var(--orange); }
.nav a svg { width: 18px; height: 18px; flex-shrink: 0; }
.nav .badge { margin-left: auto; }
.thsw-w { padding: 8px 16px 10px; border-top: 1px solid rgba(255,255,255,.08); }
.thsw-l { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; opacity: .6; margin-bottom: 6px; }
.thsw { display: flex; background: rgba(255,255,255,.06); border-radius: 9px; padding: 3px; gap: 2px; }
.thsw button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px; border: none; background: none; color: var(--side-ink);
  font-size: 12px; padding: 6px 4px; border-radius: 7px; cursor: pointer; }
.thsw button svg { width: 15px; height: 15px; flex: none; }
.thsw button:hover { color: #fff; }
.thsw button.on { background: var(--side-active); color: #fff; box-shadow: inset 0 -2px 0 var(--orange); }
.thsw button.on svg { color: var(--orange); }
.side-foot { padding: 12px 16px; font-size: 13px; border-top: 1px solid rgba(255,255,255,.08); }
.side-foot a { color: var(--side-ink); cursor: pointer; }
.main { flex: 1; min-width: 0; padding: 24px 28px 60px; }
.topbar { display: none; }

@media (max-width: 860px) {
  .side { position: fixed; z-index: 30; left: 0; top: 0; transform: translateX(-100%); transition: transform .2s; }
  .side.open { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.4); }
  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 25; }
  .topbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--surface);
    border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20; }
  .topbar .t { font-weight: 600; flex: 1; }
  .topbar .btn.hb { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); display: grid; place-items: center; padding: 0; }
  .topbar .hb svg { width: 22px; height: 22px; }
  .main { padding: 16px 16px 90px; }
  .hide-m { display: none !important; }
}

/* components */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 16px; margin-bottom: 16px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }
.spacer { flex: 1; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--border);
  background: var(--surface); padding: 8px 14px; border-radius: 9px; cursor: pointer; font-weight: 550; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); font-weight: 650; }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn.icon { padding: 6px; border: none; background: none; }
.btn svg { width: 20px; height: 20px; flex-shrink: 0; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.busy:disabled { opacity: .85; cursor: progress; }
.bset { margin: 0 0 14px; }
.bset-l { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.bseg { display: flex; gap: 3px; padding: 3px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); margin-bottom: 6px; }
.bseg button { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; min-height: 36px; padding: 6px 4px; border: none; border-radius: 7px; background: none; color: inherit; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; }
.bseg button.on { background: var(--primary); color: var(--primary-ink); font-weight: 650; }
.bseg button:disabled { opacity: .8; }
.geogate { position: fixed; inset: 0; z-index: 150; background: var(--bg); overflow-y: auto; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
.geogate-in { max-width: 420px; width: 100%; text-align: left; }
.geogate-in h2 { font-size: 22px; margin: 6px 0 12px; }
.geogate-in p, .geogate-in li { line-height: 1.5; }
.geogate-in ol { padding-left: 20px; margin: 0 0 16px; }
.geogate-in ol li { margin-bottom: 6px; }
.geogate-ic { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; background: var(--primary); color: var(--primary-ink); }
.geogate-ic svg { width: 30px; height: 30px; }
.geogate-in .btn.primary { width: 100%; min-height: 48px; justify-content: center; margin-top: 8px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.geogate-in .btn.link { width: 100%; margin-top: 10px; background: none; border: none; color: var(--muted); text-decoration: underline; justify-content: center; }
.bspin { width: 15px; height: 15px; flex: none; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
.seg button { border: none; background: var(--surface); padding: 7px 14px; cursor: pointer; }
.seg button.on { background: var(--primary); color: var(--primary-ink); font-weight: 600; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
input, select, textarea { background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 10px; min-width: 0; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
input[type=checkbox] { width: 18px; height: 18px; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 600;
  background: var(--surface-2); border: 1px solid var(--border); }
.badge.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.badge.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.badge.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.badge.info { background: var(--info-bg); color: var(--accent-ink); border-color: transparent; }
.nav .badge { background: var(--bad); color: #fff; border: none; }

.tbl-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { background: var(--surface-2); font-weight: 600; font-size: 12.5px; color: var(--muted); position: sticky; top: 0; }
tr.click { cursor: pointer; }
th.sort { cursor: pointer; user-select: none; }
th.sort:hover, th.sort.on { color: var(--text); }
th.sort .sarr { margin-left: 4px; font-size: 10px; opacity: .55; }
th.sort.on .sarr { opacity: 1; color: #FF6B35; }
.ucards { display: none; }
@media (max-width: 860px) {
  .utbl { display: none; }
  .ucards { display: flex; flex-direction: column; gap: 10px; }
  .usort { display: flex; align-items: center; gap: 8px; }
  .usort .btn.on { border-color: #FF6B35; color: var(--text); }
  .usort .btn.on .sarr { color: #FF6B35; }
  .usort .sarr { font-size: 10px; opacity: .7; }
  .ucard { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; cursor: pointer; }
  .ucard.off { opacity: .6; }
  .uc1 { display: flex; align-items: center; gap: 10px; }
  .uno { min-width: 34px; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted); }
  .unm { flex: 1; min-width: 0; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .uc2 { font-size: 13px; color: var(--muted); margin-top: 4px; padding-left: 44px; }
  .uc2 .badge { font-size: 11px; padding: 0 6px; }
  .uem { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
}
@media (max-width: 860px) and (prefers-color-scheme: dark) {
  .ucard, .tcard { border-color: rgba(255,107,53,.45); }
}
.tcards { display: none; }
@media (max-width: 860px) {
  .ttbl { display: none; }
  .tcards { display: flex; flex-direction: column; gap: 10px; }
  .tcard { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; cursor: pointer; }
  .tc1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tnm { flex: 1; min-width: 0; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tcg { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border); }
  .tcg > div { display: flex; flex-direction: column; align-items: center; }
  .tcg > div + div { border-left: 1px solid var(--border); }
  .tcg span { font-size: 11.5px; color: var(--muted); }
  .tcg b { font-size: 16px; font-variant-numeric: tabular-nums; }
  .tc3 { margin-top: 8px; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px; }
  .dnav { flex-wrap: nowrap; gap: 6px; }
  .stats.tstats { grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .stats.tstats .stat { padding: 8px 4px; text-align: center; }
  .stats.tstats .stat .v { font-size: 20px; }
  .stats.tstats .stat .l { font-size: 11px; line-height: 1.2; }
  .dnav input { min-width: 0; flex: 1; }
}
tr.click:hover td { background: var(--surface-2); }
tr.off td { background: color-mix(in srgb, var(--surface-2) 70%, transparent); color: var(--muted); }
tr.today td { box-shadow: inset 3px 0 0 var(--primary); }
tfoot td { font-weight: 650; background: var(--surface-2); }
.hstats { cursor: pointer; min-height: 10px; }
.hstats .stats { margin: 0 0 16px; }
.hstats .stat:hover { border-color: #FF6B35; }
.stats.tstats.hs4, .hstats .stats.tstats { grid-template-columns: repeat(4, 1fr); gap: 8px; }
.hstats .stat { text-align: center; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
.stat .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 12px; color: var(--muted); }
/* detail dne: tři souhrny vedle sebe, nízké */
.stats.dstats { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
.stats.dstats .stat { padding: 6px 8px; text-align: center; }
.stats.dstats .stat .v { font-size: 18px; line-height: 1.2; }
.stats.dstats .stat .l { font-size: 11px; line-height: 1.2; }
.empty { padding: 30px; text-align: center; color: var(--muted); }

/* home */
.home { max-width: 460px; margin: 0 auto; }
.home-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.home-head .logo { width: 44px; height: 44px; font-size: 20px; }
.home-head .n { font-weight: 650; font-size: 17px; }
.clock-box { text-align: center; margin-bottom: 8px; }
.clock-box .d { color: var(--muted); text-transform: capitalize; }
.clock-box .c { font-size: 40px; font-weight: 300; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.wbox { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; margin: 8px 0 16px; }
.wbox .top { display: flex; align-items: baseline; gap: 10px; margin-top: 2px; }
.wbox .big { font-size: 40px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.1; }
.wbox .proj { margin-left: auto; font-weight: 600; max-width: 50%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar { position: relative; height: 14px; border-radius: 7px; background: var(--ring-track); overflow: hidden; margin-top: 12px; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--primary); border-radius: 7px; transition: width .4s; }
.bar i.over { background: var(--ok); }
.barrow { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.barrow .bar { flex: 1; margin-top: 0; }
#rpct { font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums; min-width: 40px; text-align: right; color: var(--bad); }
#rpct.over { color: var(--ok); }
.wbox .barrow + .scale { margin-right: 50px; }
.wbox .scale .fmk { position: absolute; top: 0; transform: translateX(-50%); color: var(--text); font-weight: 600; }
.wbox .scale { position: relative; display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
.wbox .wsum { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
.wbox { text-align: center; }
.wbox .top { justify-content: center; }
.wbox .wsum { grid-template-columns: 1fr 1fr; }
.wbox .wsum div:nth-child(odd) { text-align: right; }
.wbox .wsum div:nth-child(even) { text-align: left; }
.wproj { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
.wcols { display: grid; grid-template-columns: 1fr 1fr; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
.wcol + .wcol { border-left: 1px solid var(--border); }
.wi { display: flex; flex-direction: column; align-items: center; padding: 5px 0; }
.wi span { font-size: 12px; color: var(--muted); }
.wi b { font-size: 18px; font-variant-numeric: tabular-nums; }
.wproj .pn { font-weight: 600; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wproj .pnr { display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 0; }
.wproj .pnr .pn { min-width: 0; }
.nbtn { flex: none; width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; }
.nbtn svg { width: 16px; height: 16px; }
.nbtn.has { color: #FF6B35; border-color: rgba(255,107,53,.55); }
.wproj .pnote { font-size: 13px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-style: italic; }
.ntx { width: 100%; min-height: 110px; resize: vertical; font: inherit; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; }
.kv div:nth-child(odd) { color: var(--muted); }
.kv div:nth-child(even) { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
.actions .btn { padding: 16px; font-size: 16px; border-radius: 12px; }
.actions .wide { grid-column: 1 / -1; }
.btn.in { background: #1a9e5c; border-color: #1a9e5c; color: #fff; font-weight: 800; }
.actions .btn.in { padding: 24px 16px; font-size: 22px; letter-spacing: .01em; }
.btn.out { background: #d23b3b; border-color: #d23b3b; color: #fff; font-weight: 650; }
.btn.chg { background: var(--ok-bg); border-color: var(--ok-bg); color: var(--ok); font-weight: 650; }
.btn.brk { background: var(--btn-brk); border-color: var(--btn-brk); color: var(--btn-brk-ink); }
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { display: flex; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--border); align-items: center; }
.timeline li:last-child { border-bottom: none; }
.timeline .tm { font-weight: 650; font-variant-numeric: tabular-nums; width: 48px; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.dot.IN { background: #1a9e5c; } .dot.OUT { background: var(--bad); }
.dot.BREAK_START, .dot.BREAK_END { background: var(--btn-brk); box-shadow: 0 0 0 1px var(--primary); }

/* modal */
.modal-bg { position: fixed; inset: 0; background: rgba(10,15,25,.5); z-index: 50; display: flex;
  align-items: flex-start; justify-content: center; padding: 40px 12px; overflow-y: auto; }
.modal { background: var(--surface); border-radius: 14px; width: 100%; max-width: 560px; padding: 20px;
  box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.modal.wide { max-width: 900px; }
.modal-h { display: flex; align-items: center; margin-bottom: 14px; }
.modal-h h2 { margin: 0; flex: 1; }
@media (max-width: 600px) {
  .modal-bg { padding: 0; align-items: flex-end; }
  .modal { border-radius: 16px 16px 0 0; max-height: 92vh; overflow-y: auto; }
}
.cfm-bg { position: fixed; inset: 0; background: rgba(10,15,25,.55); z-index: 70; display: flex; align-items: center; justify-content: center; padding: 16px; }
.cfm { background: var(--surface); border-radius: 14px; width: 100%; max-width: 380px; padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.cfm h2 { margin: 0 0 12px; font-size: 18px; }
.cfm-b p { margin: 0 0 8px; }
.cfm-ev { display: flex; gap: 14px; align-items: flex-start; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; background: var(--surface-2); }
.cfm-ev > div:last-child { min-width: 0; overflow-wrap: anywhere; }
.cfm-t { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
.cfm-a { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
.cfm-a .btn { min-width: 100px; }
@media (prefers-color-scheme: dark) { .cfm { border: 1px solid rgba(255,107,53,.45); } }
.hidn { text-align: center; color: var(--muted); font-size: 13px; margin: 12px 0 4px; }
.hidn a { color: var(--link); cursor: pointer; text-decoration: underline; }
.geo { display: grid; gap: 8px; }
.geo-b { display: flex; flex-wrap: wrap; gap: 6px; }
.geo-b .btn.on { border-color: var(--primary); background: var(--info-bg); }
.geo-b .dot { display: inline-block; vertical-align: 0; margin-right: 6px; }
.geo-map { width: 100%; height: 240px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); }
.plist { display: grid; gap: 8px; max-height: 55vh; overflow-y: auto; }
.psec { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 6px 2px -2px; }
.psec:first-child { margin-top: 0; }
.pbtn { text-align: left; border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 12px 14px; cursor: pointer; }
.pbtn:hover, .pbtn.on { border-color: var(--primary); background: var(--info-bg); }
.pbtn b { display: block; font-size: 16px; }

#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 80; pointer-events: none; }
.toast { background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 10px; margin-top: 8px; box-shadow: 0 8px 30px rgba(0,0,0,.25); max-width: 90vw; }
.toast.err { background: var(--bad); }

.login { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
.login .card { width: 100%; max-width: 380px; padding: 28px; }
.login .rem { display: flex; flex-wrap: nowrap; align-items: flex-start; gap: 10px; color: var(--text); font-size: 14px; cursor: pointer; }
.login .rem input { margin-top: 3px; width: 17px; height: 17px; accent-color: var(--primary); flex: none; }
.login .rem span { min-width: 0; }
.login .rem small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.login .logo { width: 84px; height: 84px; font-size: 24px; margin: 0 auto 12px; }
.login form { display: grid; gap: 12px; margin-top: 18px; }
.splash { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 200; }
.splash-logo { width: min(62vw, 260px); height: auto; aspect-ratio: 1; }
.shards { position: fixed; inset: 0; pointer-events: none; }
.shards i { position: fixed; background-repeat: no-repeat; will-change: transform, opacity; }
#splash[data-out] { pointer-events: none; }

/* načítání vždy uprostřed obrazovky ve stejné velikosti jako při startu aplikace */
.loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 60; pointer-events: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.ctbl { table-layout: fixed; }
.ctbl th, .ctbl td { padding: 8px 6px; }
.ctbl td.ev { white-space: normal; }
.ctbl td.tm2 { white-space: nowrap; }
.ctbl .otm { color: var(--muted); font-size: 12.5px; font-weight: 400; }
.timeline .tm { display: flex; flex-direction: column; line-height: 1.2; flex: none; }
.timeline .otm { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
.timeline .tlx { min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ctbl col.ctm { width: 58px; } .ctbl col.ctm2 { width: 104px; }
@media (max-width: 860px) {
  .ctbl col.ctm2 { width: 62px; }
  .ctbl .otm { display: block; font-size: 12px; }
}
.ctbl td.ev .dot { display: inline-block; margin-right: 6px; }
.ctbl td.pj { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctbl td.pj div { overflow: hidden; text-overflow: ellipsis; }
.ctbl td.act { text-align: right; white-space: nowrap; padding-right: 4px; }
.ctbl .btn.icon { padding: 6px; color: var(--muted); }
.ctbl .btn.icon:hover { color: var(--text); background: var(--surface-2); }
.ctbl .btn.icon.danger { color: var(--bad); }
.home-head .muted { font-weight: 600; }
.hrh { display: flex; align-items: center; gap: 10px; justify-content: space-between; margin-bottom: 6px; }
.hrh h2 { margin: 0; }
.home-foot { text-align: center; color: var(--muted); font-size: 12px; margin: 22px 0 6px; letter-spacing: .02em; }
.topbar .tdate { font-size: 11px; color: var(--muted); text-transform: capitalize; line-height: 1.2; }
#tst { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; min-width: 0; }
#tst .tuser { font-size: 12px; font-weight: 600; color: var(--muted); max-width: 42vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.2; }
#tst .badge { font-size: 11px; padding: 1px 7px; }
.topbar .tclk { font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.2; margin-top: 3px; }
@media (max-width: 860px) {
  .topbar { padding-top: 6px; padding-bottom: 6px; min-height: 53px; }
  .home .clock-box, .home .home-head { display: none; }
  .home .wbox { margin-top: 0; }
  /* domovská obrazovka na jednu obrazovku telefonu */
  .main:has(> .home) { padding: 10px 12px 8px; }
  .home { display: flex; flex-direction: column; min-height: calc(100dvh - 53px - 18px); }
  .hstats .stats.tstats { margin-bottom: 8px; gap: 6px; }
  .hstats .stat { padding: 5px 2px; }
  .hstats .stat .v { font-size: 18px; line-height: 1.15; }
  .hstats .stat .l { font-size: 10.5px; }
  .home .wbox { padding: 10px 14px 8px; margin-bottom: 0; }
  .home .wbox .big { font-size: 34px; }
  .home .bar { height: 10px; margin-top: 6px; }
  .home .barrow { margin-top: 6px; }
  .home .barrow .bar { margin-top: 0; }
  .home .wbox .scale { margin-top: 3px; }
  .home .wproj { margin-top: 8px; padding-top: 7px; }
  .home .wproj .pn { font-size: 16px; }
  .home .wcols { margin-top: 7px; padding-top: 4px; }
  .home .wi { padding: 2px 0; }
  .home .wi b { font-size: 16px; }
  .home .actions { margin: 10px 0; gap: 8px; }
  .home .actions .btn { padding: 12px; }
  .home .actions .btn.in { padding: 16px 12px; font-size: 20px; }
  .home .hrec { flex: 1 1 0; min-height: 84px; display: flex; flex-direction: column; padding: 10px 14px; margin-bottom: 0; }
  .home .hrec h2 { font-size: 15px; margin: 0 0 4px; }
  .home .hrec .timeline { flex: 1 1 0; min-height: 0; overflow-y: auto; }
  .home .hrec .timeline li { padding: 5px 0; }
  .home .home-foot { margin: 8px 0 0; }
}
.hist { font-size: 13px; border-left: 2px solid var(--border); padding-left: 12px; margin: 6px 0; }
/* tmavý režim: jemně oranžové rámečky karet */
@media (prefers-color-scheme: dark) {
  .card, .wbox, .stat, .tbl-wrap { border-color: rgba(255,107,53,.45); }
  .modal { border: 1px solid rgba(255,107,53,.45); }
}
/* barvy projektů */
.pdot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; flex: none; }
.wproj .pnr .pdot { width: 12px; height: 12px; margin-right: 0; }
.pbadge { border-color: var(--pc); border-left: 4px solid var(--pc); }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.sw { position: relative; cursor: pointer; }
.sw input { position: absolute; opacity: 0; pointer-events: none; }

}

    .then(j => { if (j.e) throw new Error(j.e); return j.r; });

function appUrl() { return window.__API ? location.origin + '/' : S.boot.webUrl; }

/* ---------- rychlost: okamžité zobrazení z paměti zařízení, čerstvá data se dotáhnou na pozadí ---------- */
const SWR_ACTIONS = { today: 1, dayAll: 1, month: 1, monthAll: 1, projects: 1, users: 1, absences: 1 };
let SWR = null; // { seq, pending, fresh }
function cStore() { return S.shared ? sess : store; }
function cKey(action, args) { return 'c:' + (S.boot && S.boot.user ? S.boot.user.email : '') + ':' + action + ':' + JSON.stringify(args || {}); }
function cGet(k) { try { const v = cStore().get(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }

  try { if (view === 'team' || view === 'users') S.users = null; await VIEWS[view](el, params || {}); } catch (e) {} finally { if (SWR && SWR.seq === seq) SWR = null; }

function prefetch() {
  if (!S.boot) return;
  const ym = ymNow(), list = [['month', { email: S.boot.user.email, year: ym.year, month: ym.month }]];
  if (isMgr()) list.push(['users', undefined], ['dayAll', { date: localDate() }], ['projects', undefined]);

/* ---------- modal ---------- */
function openModal(title, html, wide) {
  closeModal();
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = '<div class="modal' + (wide ? ' wide' : '') + '"><div class="modal-h"><h2>' + esc(title) + '</h2><button class="btn icon" data-close>' + icon('x') + '</button></div><div class="modal-b">' + html + '</div></div>';
  bg.addEventListener('click', e => { if (e.target === bg || e.target.closest('[data-close]')) closeModal(); });
  $('#modal-root').appendChild(bg);
  return $('.modal-b', bg);
}
function closeModal() { $('#modal-root').innerHTML = ''; }
/* vlastní potvrzovací okno (místo prohlížečového confirm) */
function askConfirm(title, html, okLabel, danger) {
  return new Promise(res => {
    const bg = document.createElement('div');
    bg.className = 'cfm-bg';
    bg.innerHTML = '<div class="cfm" role="dialog"><h2>' + esc(title) + '</h2>' + (html ? '<div class="cfm-b">' + html + '</div>' : '') +
      '<div class="cfm-a"><button class="btn" data-n>Zrušit</button><button class="btn ' + (danger ? 'out' : 'primary') + '" data-y>' + esc(okLabel || 'OK') + '</button></div></div>';
    const done = v => { bg.remove(); document.removeEventListener('keydown', key); res(v); };
    const key = e => { if (e.key === 'Escape') done(false); };
    bg.addEventListener('click', e => { if (e.target === bg || e.target.closest('[data-n]')) done(false); else if (e.target.closest('[data-y]')) done(true); });
    document.addEventListener('keydown', key);
    document.body.appendChild(bg);
    $('[data-y]', bg).focus();
  });
}

/* ---------- přihlášení ---------- */
function viewLogin(msg) {
  stopTick(); endSplash();
  document.querySelectorAll('.backdrop').forEach(b => b.remove()); // po odhlášení z otevřeného menu nesmí zůstat zakrývající vrstva
  $('#app').innerHTML = '<div class="login"><div class="card"><div style="text-align:center"><div class="logo ic"><img src="' + APP_LOGO + '" alt="Remoza"></div>' +
    '<h1 style="margin:0">Remoza-docházka</h1><div class="muted small">Přihlaste se svým firemním e-mailem</div></div>' +
    '<form id="lf"><label class="f">E-mail<input name="email" type="email" autocomplete="username" required value="' + esc(store.get('lastEmail') || '') + '"></label>' +
    '<label class="f">Heslo<input name="pw" type="password" autocomplete="current-password" required></label>' +
    '<label class="row rem"><input type="checkbox" name="rem"' + (store.get('remember') === '0' ? '' : ' checked') + '> <span>Zapamatovat si mě<small>Na sdíleném počítači nezaškrtávejte – odhlásí vás po ' + IDLE_MIN + ' min nečinnosti.</small></span></label>' +
    '<button class="btn primary" type="submit">Přihlásit</button>' +
    (msg ? '<div class="small" style="color:var(--bad)">' + esc(msg) + '</div>' : '') + '</form></div></div>';
  $('#lf').addEventListener('submit', async e => {
    e.preventDefault();
    const f = e.target, b = $('button', f);
    b.disabled = true; b.textContent = 'Přihlašuji…';
    try {
      const rem = f.rem.checked;
      const r = await gs('login', f.email.value, f.pw.value, deviceTz(), rem);
      if (!r.ok) throw new Error(r.error);
      S.token = r.data.token; S.shared = !rem; store.set('remember', rem ? '1' : '0');
      if (rem) { store.set('token', S.token); store.set('lastEmail', f.email.value); sess.del('token'); }
      else { sess.set('token', S.token); store.del('token'); store.del('lastEmail'); }
      startIdle();
      S.boot = r.data.boot; setToday(S.boot.today);
      try { cStore().set('boot', JSON.stringify({ t: Date.now(), tok: S.token.slice(-12), d: S.boot })); } catch (e) {}
      setTimeout(prefetch, 1500);
      renderShell();
    } catch (err) { viewLogin(err.message); }
  });
}

/* ---------- povinná poloha: zaměstnance bez povolené polohy aplikace nepustí dál ---------- */
const GEO = { st: 'ok', perm: null, busy: false };
function geoForced() { const s = S.boot && S.boot.settings; return !!(s && s.geoMode !== 'off' && s.geoForce !== false && !isMgr() && S.token); }

// zjistí stav: ok | prompt | denied | off (GPS v telefonu vypnutá) | none (prohlížeč polohu neumí)
async function geoCheck(probe) {
  if (!geoForced()) return 'ok';
  if (!navigator.geolocation) return 'none';
  let st = null;
  try { if (navigator.permissions) { const p = await navigator.permissions.query({ name: 'geolocation' }); st = p.state; if (!GEO.perm) { GEO.perm = p; p.onchange = () => geoGate(true); } } } catch (e) {}
  if (st === 'prompt') return 'prompt';

  if (st === 'granted' && !probe) return 'ok';
  // bez Permissions API (starší iPhone) nebo kontrola, že poloha v telefonu není vypnutá
  return await new Promise(res => {
    let done = false; const fin = v => { if (!done) { done = true; res(v); } };
    setTimeout(() => fin(st === 'granted' ? 'ok' : 'prompt'), 16000);

      navigator.geolocation.getCurrentPosition(() => fin('ok'), e => fin(e.code === 1 ? 'denied' : e.code === 2 ? 'off' : 'ok'),

    } catch (e) { fin('ok'); }
  });
}

    catch (e) { fin(null); }

    if (pid) { const r = (S.boot.recentProjects || []).filter(x => x !== pid); r.unshift(pid); S.boot.recentProjects = r.slice(0, 4); try { const c = JSON.parse(cStore().get('boot') || 'null'); if (c && c.d) { c.d.recentProjects = S.boot.recentProjects; cStore().set('boot', JSON.stringify(c)); } } catch (e) {} }
    setToday(t);
    if (pid !== null) S.lastProject = pid;
    toast(S.boot.settings.eventTypes[type] + ' ' + (t.punchTime || t.time) + (type === 'IN' ? ' · ' + projLabel(pid) : ''));
    if (S.view === 'home') renderHome(el);
  } catch (e) { S.punching = false; S.today = prev; S.fetchedAt = prevAt; if (S.view === 'home') renderHome(el); fail(e); }
}
function pickProject(title, cb, current) {
  const list = S.boot.projects;
  const recent = (S.boot.recentProjects || []).map(id => list.filter(p => p.id === id)[0]).filter(Boolean);
  const m = openModal(title, '<input id="pq" placeholder="Hledat projekt…" style="width:100%;margin-bottom:10px">' +
    '<div class="plist" id="pl"></div><div class="row end" style="margin-top:12px"><button class="btn" type="button" data-close>Zavřít</button></div>');
  const draw = q => {
    q = (q || '').toLowerCase();
    const none = { id: '', code: 'Bez projektu', name: 'Práce mimo projekty' };
    const btn = p => '<button class="pbtn' + ((current !== undefined ? current : S.lastProject) === p.id ? ' on' : '') + '" style="--pc:' + projColor(p.id) + '" data-id="' + esc(p.id) + '"><b>' + esc(p.code) + '</b><span class="muted small">' + esc(p.name) + '</span></button>';
    let html;
    if (q) {
      html = [none].concat(list).filter(p => (p.code + ' ' + p.name).toLowerCase().indexOf(q) >= 0).map(btn).join('');
    } else if (recent.length && list.length > 4) {
      // nahoře naposledy použité, pod nimi ostatní abecedně podle kódu
      const rid = recent.map(p => p.id);
      html = '<div class="psec">Naposledy použité</div>' + recent.map(btn).join('') +
        '<div class="psec">Všechny projekty</div>' + [none].concat(list.filter(p => rid.indexOf(p.id) < 0)).map(btn).join('');
    } else html = [none].concat(list).map(btn).join('');
    $('#pl', m).innerHTML = html || '<div class="muted">Nic nenalezeno.</div>';
    $$('.pbtn', m).forEach(b => b.onclick = () => { closeModal(); cb(b.dataset.id); });
  };
  draw('');
  $('#pq', m).oninput = e => draw(e.target.value);
  if (list.length > 8) $('#pq', m).focus(); else $('#pq', m).style.display = list.length > 4 ? '' : 'none';
}

/* ================================================================
 *  DETAIL DNE – záznamy, opravy, historie

async function openDay(email, date, onChange) {

function renderDay(m, d, onChange) {
  const s = S.boot.settings, c = d.calc;
  $('.modal-h h2').textContent = DAYS[d.weekday].replace(/^./, x => x.toUpperCase()) + ' ' + czDate(d.date) + ' – ' + d.user.name;

    (d.flags.length || d.absences.length || d.holiday ? '<div style="margin-bottom:12px">' + (d.holiday ? badge('Státní svátek', 'info') + ' ' : '') + d.absences.map(a => badge(a.label + ' ' + dur(a.min), 'info')).join(' ') + ' ' + flagBadges(d.flags) + '</div>' : '') +

      '<td class="ev"><span class="dot ' + e.type + '"></span>' + esc(s.eventTypes[e.type]) + '</td>' +
      '<td class="pj" title="' + esc(e.type === 'IN' ? projLabel(e.projectId) : '') + '">' + (e.type === 'IN' ? pdot(e.projectId) + esc(projLabel(e.projectId)) : '') + (e.note ? '<div class="muted small">' + esc(e.note) + '</div>' : '') + '</td>' +
      '<td class="act">' + (d.canEdit ? '<button class="btn icon" title="Upravit" aria-label="Upravit" data-ed="' + e.id + '">' + icon('edit') + '</button><button class="btn icon danger" title="Smazat" aria-label="Smazat" data-del="' + e.id + '">' + icon('trash') + '</button>' : '') + '</td></tr>').join('')
      : '<tr><td colspan="4" class="muted">Žádné záznamy</td></tr>') + '</tbody></table></div>' +
    geoHtml(d) +
    (projRows ? '<h2 style="margin-top:16px">Projekty</h2><div class="tbl-wrap"><table class="ctbl"><colgroup><col><col style="width:64px"><col style="width:64px"><col style="width:64px"></colgroup><thead><tr><th>Projekt</th><th>Začátek</th><th>Konec</th><th>Celkem</th></tr></thead><tbody>' + projRows + '</tbody></table></div>' : '') +
    (d.canEdit ? '<div class="card" style="margin-top:16px;background:var(--surface-2)"><h2 id="eft">Přidat záznam</h2><form id="ef" class="grid2">' +
      '<label class="f">Čas<input name="time" type="time" required></label>' +

      '<input type="hidden" name="id"></form></div>' : '<div class="row" style="margin-top:12px"><span class="muted small">Tento den nelze upravovat.</span><div class="spacer"></div><button class="btn" type="button" data-close>Zavřít</button></div>') +
    '<details style="margin-top:16px"><summary><b>Historie změn (' + d.history.length + ')</b></summary>' +
    (d.history.length ? d.history.map(h => '<div class="hist"><b>' + esc(HIST[h.action] || h.action) + '</b> · ' + esc(h.ts.replace('T', ' ')) + ' · ' + esc(h.actor) + '<br>' +
      (h.before ? '<span class="muted">' + esc(evText(h.before)) + '</span>' + (h.after ? ' → ' : '') : '') + (h.after ? esc(evText(h.after)) : '') + '</div>').join('') : '<div class="muted small">Žádné změny.</div>') + '</details>';

  bindGeo(m, d);
  $$('[data-bs]', m).forEach(b => b.onclick = async () => {

    b.classList.add('busy'); b.disabled = true; b.innerHTML = '<span class="bspin"></span>';
    try { const nd = await call('setDayBreak', { email: d.user.email, date: d.date, minutes: b.dataset.bs }); toast('Přestávka uložena'); renderDay(m, nd, onChange); if (onChange) onChange(); }
    catch (err) { fail(err); renderDay(m, d, onChange); }
  });
  const f = $('#ef', m);
  if (f) {
    const syncType = () => { $('#efp', m).style.display = f.type.value === 'IN' ? '' : 'none'; };
    let touched = false;
    const defTime = () => {
      if (touched || f.id.value) return;
      const u = d.user, st = toMinC(u.coreStart || s.coreStart || '08:00');
      const daily = Math.round((u.dailyHours || s.dailyHours || 8) * 60);
      const brk = daily > (+s.breakAfterHours || 6) * 60 ? (+s.breakMinutes || 30) : 0;
      const ins = d.events.filter(e => e.type === 'IN');
      const lastP = ins.length ? projById(ins[ins.length - 1].projectId) : null;
      const selP = projById(f.projectId.value);
      let h;
      if (f.type.value === 'IN') { if (selP && selP.start) { f.time.value = selP.start; return; } h = Math.floor(st / 60); }
      else if (f.type.value === 'OUT') { if (lastP && lastP.end) { f.time.value = lastP.end; return; } h = Math.floor((st + daily + brk) / 60); }
      else h = new Date().getHours();
      f.time.value = pad(Math.min(h, 23)) + ':00';
    };
    f.time.oninput = () => { touched = true; };

      const b = $('button[type=submit]', f); b.disabled = true;

        const nd = await call('saveEvent', { id: f.id.value, email: d.user.email, date: d.date, time: f.time.value, type: f.type.value, projectId: f.projectId.value, note: f.note.value });

      } catch (err) { fail(err); b.disabled = false; }
    };
    $$('[data-ed]', m).forEach(b => b.onclick = () => {
      const ev = d.events.filter(x => x.id === b.dataset.ed)[0];
      f.id.value = ev.id; f.time.value = ev.time; f.type.value = ev.type; f.projectId.value = ev.projectId || ''; f.note.value = ev.note || '';
      $('#eft', m).textContent = 'Upravit záznam ' + ev.time; $('#efc', m).style.display = ''; syncType();
      f.scrollIntoView({ behavior: 'smooth' });
    });
    $$('[data-del]', m).forEach(b => b.onclick = async () => {
      const ev = d.events.filter(x => x.id === b.dataset.del)[0] || {};
      const det = '<div class="cfm-ev"><div class="cfm-t">' + esc(ev.time || '') + (ev.origTime ? ' <span class="muted small">(' + esc(ev.origTime) + ')</span>' : '') + '</div>' +
        '<div><b>' + esc(S.boot.settings.eventTypes[ev.type] || ev.type || '') + '</b>' +
        (ev.type === 'IN' ? '<div class="small">' + pdot(ev.projectId || '') + esc(projLabel(ev.projectId, false)) + '</div>' : '') +
        (ev.note ? '<div class="small muted">' + esc(ev.note) + '</div>' : '') + '</div></div>' +
        '<div class="small muted">' + esc(d.user.name || '') + ' · ' + czDate(d.date) + '</div>';
      if (!await askConfirm('Smazat záznam?', det, 'Smazat', true)) return;
      try { const nd = await call('deleteEvent', { id: b.dataset.del }); toast('Smazáno'); renderDay(m, nd, onChange); if (onChange) onChange(); } catch (err) { fail(err); }
    });
  }
}
/* poloha příchodu/odchodu v detailu dne (server ji posílá jen vedoucím a adminům) */
function mapUrl(g, embed) { const q = g.lat.toFixed(6) + ',' + g.lng.toFixed(6); return embed ? 'https://maps.google.com/maps?q=' + q + '&z=16&output=embed' : 'https://www.google.com/maps/search/?api=1&query=' + q; }
function geoHtml(d) {
  const ge = d.events.filter(e => e.geo);
  if (!ge.length) return '';
  return '<h2 style="margin-top:16px">Poloha</h2><div class="geo"><div class="geo-b">' + ge.map((e, i) =>
      '<button type="button" class="btn sm' + (i === 0 ? ' on' : '') + '" data-geo="' + e.id + '"><span class="dot ' + e.type + '"></span>' + esc(S.boot.settings.eventTypes[e.type]) + ' ' + esc(e.time) + (e.geo.acc ? ' <span class="muted">±' + Math.round(e.geo.acc) + ' m</span>' : '') + '</button>').join('') + '</div>' +
    '<iframe class="geo-map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="' + mapUrl(ge[0].geo, true) + '"></iframe>' +
    '<a class="small" id="geo-a" href="' + mapUrl(ge[0].geo) + '" target="_blank" rel="noopener">Otevřít v Mapách Google</a> <span class="muted small">· vidí jen vedoucí a administrátor</span></div>';
}
function bindGeo(m, d) {
  $$('[data-geo]', m).forEach(b => b.onclick = () => {
    const e = d.events.filter(x => x.id === b.dataset.geo)[0]; if (!e) return;
    $$('[data-geo]', m).forEach(x => x.classList.toggle('on', x === b));
    $('.geo-map', m).src = mapUrl(e.geo, true); $('#geo-a', m).href = mapUrl(e.geo);
  });
}
/* volba přestávky za den (vedoucí): automaticky podle nastavení / bez přestávky / 30 / 60 min */
function breakSetHtml(d) {
  const c = d.calc, set = c.breakSet === null || c.breakSet === undefined ? '' : String(c.breakSet);
  if (!d.canSetBreak || (!c.grossMin && set === '')) return '';
  const opts = [['', 'Auto'], ['0', 'Žádná'], ['30', '30 min'], ['60', '60 min']];
  const s = S.boot.settings;
  const hint = set === '' ? 'Podle nastavení: ' + (s.breakMinutes || 30) + ' min po ' + (s.breakAfterHours || 6) + ' h práce.'
    : set === '0' ? 'Tento den se automatická přestávka neodečítá.' + (c.recBreakMin ? ' Zapsané přestávky (' + c.recBreakMin + ' min) se počítají dál – případně je smažte v záznamech.' : '')
    : 'Přestávka tento den celkem ' + set + ' min' + (c.recBreakMin ? ' (z toho zapsáno ' + c.recBreakMin + ' min).' : '.');
  return '<div class="bset"><div class="bset-l">Přestávka za den</div><div class="bseg">' +
    opts.map(o => '<button type="button" class="' + (o[0] === set ? 'on' : '') + '" data-bs="' + o[0] + '">' + o[1] + '</button>').join('') +
    '</div><div class="muted small">' + esc(hint) + '</div></div>';
}
function evText(e) {
  if (e.minutes !== undefined) return +e.minutes ? 'přestávka ' + e.minutes + ' min' : 'bez přestávky';
  return (e.date ? czDate(e.date) + ' ' : '') + (e.time || '') + ' ' + (S.boot.settings.eventTypes[e.type] || e.type || '') +
    (e.type === 'IN' ? ' (' + projLabel(e.projectId, true) + ')' : '') + (e.note ? ' – ' + e.note : '');
}

/* ================================================================
 *  MĚSÍČNÍ PŘEHLED

function monthNav(y, m, id) {
  return '<div class="row"><button class="btn icon" data-mn="-1">' + icon('left') + '</button>' +
    '<input type="month" id="' + id + '" value="' + ymStr(y, m) + '"><button class="btn icon" data-mn="1">' + icon('right') + '</button></div>';
}
function bindMonthNav(root, id, cb) {
  const inp = $('#' + id, root);
  inp.onchange = () => { const p = inp.value.split('-'); if (p.length === 2) cb(+p[0], +p[1]); };
  $$('[data-mn]', root).forEach(b => b.onclick = () => {
    const p = inp.value.split('-'); let y = +p[0], m = +p[1] + (+b.dataset.mn);
    if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; }
    cb(y, m);
  });
}
function monthStats(sum) {

    '<div class="stat"><div class="v" style="color:' + (sum.saldoMin < 0 ? 'var(--bad)' : 'var(--ok)') + '">' + (sum.saldoMin > 0 ? '+' : '') + dur(sum.saldoMin) + '</div><div class="l">Saldo (přesčas / chybí)</div></div></div>';
}
function monthTable(md) {
  const rows = md.days.map(d => {
    const c = d.calc;
    const br = c.breaks.filter(b => b.end > b.start).map(b => hm(b.start) + '–' + hm(b.end)).join(', ');
    const pr = Object.keys(c.projects).map(p => '<span class="badge pbadge" style="--pc:' + projColor(p) + '">' + esc(projLabel(p, true)) + ' ' + dur(c.projects[p].min) + '</span>').join(' ');
    return '<tr class="click' + (!d.workday ? ' off' : '') + (d.isToday ? ' today' : '') + '" data-date="' + d.date + '">' +

      '<td class="num">' + hm(c.firstIn) + '</td><td class="num">' + (c.lastOut !== null ? hm(c.lastOut) : (c.state !== 'OUT' && d.isToday ? '…' : '')) + '</td>' +
      '<td class="num small">' + esc(br) + (c.autoBreakMin ? ' <span class="muted">+auto ' + c.autoBreakMin + '</span>' : '') + '</td>' +
      '<td class="num"><b>' + (c.netMin ? dur(c.netMin) : '') + '</b></td><td>' + pr + '</td>' +
      '<td>' + (d.holiday ? badge('Svátek', 'info') + ' ' : '') + d.absences.map(a => badge(a.label, 'info')).join(' ') + '</td><td>' + flagBadges(d.flags.filter(f => f !== 'autoBreak')) + '</td></tr>';
  }).join('');
  const cards = md.days.map(d => {
    const c = d.calc, has = c.firstIn !== null || c.netMin;
    const tags = (d.holiday ? badge('Svátek', 'info') + ' ' : '') + d.absences.map(a => badge(a.label, 'info')).join(' ') + ' ' + flagBadges(d.flags.filter(f => f !== 'autoBreak'));
    const pr = Object.keys(c.projects).map(p => '<span class="badge pbadge" style="--pc:' + projColor(p) + '">' + esc(projLabel(p, true)) + ' ' + dur(c.projects[p].min) + '</span>').join(' ');
    return '<div class="tcard mcard click' + (!d.workday ? ' off' : '') + (d.isToday ? ' today' : '') + (has ? '' : ' nodata') + '" data-date="' + d.date + '">' +
      '<div class="tc1"><span class="tnm"><b>' + DAYS_S[d.weekday] + '</b> ' + (+d.date.slice(8)) + '. ' + (+d.date.slice(5, 7)) + '.</span>' + tags + '</div>' +
      (has ? '<div class="tcg"><div><span>Příchod</span><b>' + (hm(c.firstIn) || '—') + '</b></div><div><span>Odchod</span><b>' + (c.lastOut !== null ? hm(c.lastOut) : (c.state !== 'OUT' && d.isToday ? '…' : '—')) + '</b></div><div><span>Přestávka</span><b>' + (c.breakMin ? dur(c.breakMin) : '—') + '</b></div><div><span>Práce</span><b>' + (c.netMin ? dur(c.netMin) : '—') + '</b></div></div>' : '') +
      (pr ? '<div class="tc3">' + pr + '</div>' : '') + '</div>';
  }).join('');
  return '<div class="tcards mcards">' + cards + '</div><div class="tbl-wrap ttbl"><table><thead><tr><th>Den</th><th>Příchod</th><th>Odchod</th><th>Přestávka</th><th>Práce</th><th>Projekty</th><th>Absence</th><th></th></tr></thead><tbody>' + rows +
    '</tbody><tfoot><tr><td>Celkem</td><td></td><td></td><td></td><td class="num">' + dur(md.sum.netMin) + '</td><td colspan="3"></td></tr></tfoot></table></div>';
}
async function renderMonthInto(box, email, y, m) {

function hiddenNote(n) {
  if (S.teamShowAll) return '<div class="hidn"><a data-hid="0">Skrýt pracovníky bez odpracované doby</a></div>';
  return n > 0 ? '<div class="hidn">Skryto ' + n + ' ' + (n === 1 ? 'pracovník' : n < 5 ? 'pracovníci' : 'pracovníků') + ' bez odpracované doby · <a data-hid="1">Zobrazit</a></div>' : '';
}
function bindHidden(box, el) { const a = $('[data-hid]', box); if (a) a.onclick = () => { S.teamShowAll = a.dataset.hid === '1'; VIEWS.team(el, {}); }; }
function toMinC(t) { const p = String(t || '').split(':'); return (+p[0] || 0) * 60 + (+p[1] || 0); }
function teamCounts(list) {
  const c = { IN: 0, BREAK: 0, OUT: 0, ABS: 0 };
  list.forEach(r => { c[r.day.calc.state]++; if (r.day.absences.length) c.ABS++; });
  return c;
}
function teamTiles(c, cls) {
  return '<div class="stats tstats ' + (cls || '') + '"><div class="stat"><div class="v">' + c.IN + '</div><div class="l">V práci</div></div><div class="stat"><div class="v">' + c.BREAK + '</div><div class="l">Na přestávce</div></div><div class="stat"><div class="v">' + c.OUT + '</div><div class="l">Mimo práci</div></div><div class="stat"><div class="v">' + c.ABS + '</div><div class="l">Absence</div></div></div>';
}
function sortTeam(list) {
  const coll = new Intl.Collator('cs', { sensitivity: 'base' });
  return list.slice().sort((a, b) => coll.compare(a.user.lastName || '', b.user.lastName || '') || coll.compare(a.user.firstName || '', b.user.firstName || ''));
}
function teamName(u) { return '<span class="tnm"><b>' + esc(u.lastName || u.name) + '</b>' + (u.lastName ? ' ' + esc(u.firstName) : '') + '</span>'; }

  el.innerHTML = '<h1>Exporty</h1><div class="card"><div class="grid2">' +

    '<label class="f">Pracovník<select id="eu"><option value="ME">Já (' + esc(S.boot.user.name) + ')</option>' +
    (isMgr() ? '<option value="ALL">Všichni aktivní (každý na vlastním listu)</option>' + users.filter(u => u.active && u.email !== S.boot.user.email).map(u => '<option value="' + esc(u.email) + '">' + esc(u.name) + '</option>').join('') : '') + '</select></label></div>' +
    '<div class="row" style="margin-top:16px"><button class="btn primary" data-x="exportXlsx">Excel (.xlsx)</button><button class="btn" data-x="exportPdf">PDF</button>' +
    (isMgr() ? '<button class="btn" data-x="exportMoney">Money S3 (CSV)</button>' : '') + '</div>' +
    '<div id="eres" style="margin-top:16px"></div></div>' +
    '<div class="muted small">Exporty se zároveň ukládají na Google Disk do složky „Remoza-docházka – exporty“. Export pro Money S3 obsahuje vždy všechny aktivní pracovníky.</div>';
  $$('[data-x]', el).forEach(b => b.onclick = async () => {
    const p = $('#em', el).value.split('-');
    const res = $('#eres', el);
    $$('[data-x]', el).forEach(x => x.disabled = true);
    res.innerHTML = '<div class="row"><div class="spinner" style="width:56px;height:56px"></div> Připravuji export…</div>';
    try {
      const r = await call(b.dataset.x, { year: +p[0], month: +p[1], email: $('#eu', el).value });
      downloadB64(r);
      res.innerHTML = '✓ <b>' + esc(r.name) + '</b> – stahování by mělo začít automaticky. <a href="' + esc(r.url) + '" target="_blank" rel="noopener">Otevřít na Google Disku</a>';
    } catch (e) { res.innerHTML = ''; fail(e); }
    $$('[data-x]', el).forEach(x => x.disabled = false);
  });
};
function downloadB64(r) {
  try {
    const bin = atob(r.b64), arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([arr], { type: r.mime }));
    const a = document.createElement('a'); a.href = url; a.download = r.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  } catch (e) { /* stažení zablokováno – zůstává odkaz na Disk */ }
}

function auditDetail(x) {
  const parse = s => { try { return s ? JSON.parse(s) : null; } catch (e) { return null; } };
  const b = parse(x.before), a = parse(x.after);
  if (x.entity === 'Event') return esc((b ? evText(b) : '') + (b && a ? ' → ' : '') + (a ? evText(a) : ''));
  if (!b && !a) return '';
  if (b && a) {
    const ch = Object.keys(a).filter(k => String(a[k]) !== String(b[k]) && k !== 'createdAt');
    return esc(ch.map(k => k + ': ' + (b[k] || '∅') + ' → ' + (a[k] || '∅')).join('; '));
  }
  const o = a || b;
  return esc(Object.keys(o).filter(k => o[k] && k !== 'createdAt').slice(0, 6).map(k => k + ': ' + o[k]).join('; '));
}

window.addEventListener('popstate', e => { if (S.boot && $('#main')) { go((e.state && e.state.v) || 'home', null, true); } });
(async function init() {
  S.starting = true;
  S.token = store.get('token');
  if (!S.token) { S.token = sess.get('token'); S.shared = !!S.token; }
  if (!S.token) return viewLogin();
  startIdle();
  let cached = null;
  try { cached = JSON.parse(cStore().get('boot') || 'null'); } catch (e) {}
  if (cached && cached.tok === S.token.slice(-12) && cached.d && cached.d.user) {
    S.boot = cached.d;
    if (S.boot.today && S.boot.today.date === localDate()) { S.today = S.boot.today; S.fetchedAt = cached.t; }
    renderShell();
  }
  try {
    const b = await callNet('bootstrap');
    const changed = !cached || JSON.stringify(b) !== JSON.stringify(cached.d);
    S.boot = b;
    try { cStore().set('boot', JSON.stringify({ t: Date.now(), tok: S.token.slice(-12), d: b })); } catch (e) {}
    if (!cached) { setToday(b.today); renderShell(); }
    else if (changed) { renderNav(); if (S.view === 'home' && !S.punching) { setToday(b.today); go('home'); } }
    setTimeout(prefetch, 1500);
  } catch (e) {
    if (S.token && !cached) viewLogin(e.message);
  }
})();
</script>
